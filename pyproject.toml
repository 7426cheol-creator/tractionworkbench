[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traction-workbench"
version = "0.5.0"
description = "Traction inverter-motor engineering feasibility and decision workbench (steady-state fundamental dq model)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6", "matplotlib>=3.8"]
report = ["matplotlib>=3.8"]
test = ["pytest>=7", "fmpy>=0.3.20"]
build = ["pyinstaller>=6.3"]

[project.scripts]
twb = "traction_workbench.cli:main"

[project.gui-scripts]
traction-workbench = "traction_workbench.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traction_workbench = ["desktop/resources/*", "mathworks/matlab/+twb/*.m", "extensions/faultsim/packages/*.json",
                       "data/*.json", "data/fmi2/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
