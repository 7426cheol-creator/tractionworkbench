name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Linux, headless Qt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test]"
      - name: Independent fixture check (no production code)
        run: python verification/independent_fixture_check.py
      - name: Tests (golden, semantics, extensions, plot data, PDF report, desktop smoke)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  mathworks:
    name: MathWorks transfer package (GNU Octave runs the MATLAB code)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: GNU Octave (MATLAB-language runner; MATLAB / Simulink stages stay NOT_RUN)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Export the package, run twb.runAll in Octave, re-import and recompute the report
        run: |
          twb mathworks export build/mathworks
          twb mathworks run build/mathworks --runtime octave
      - name: Transfer tests with the target side executed (parity, planted defects, guards)
        run: python -m pytest -q tests/test_mathworks.py
      - name: Upload the package and its report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-transfer-package
          path: build/mathworks
          if-no-files-found: ignore

  windows:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]"
      - name: Build with PyInstaller and self-test the frozen application
        run: python packaging/build.py
      - name: Upload the portable application (zip)
        uses: actions/upload-artifact@v4
        with:
          name: TractionWorkbench-windows-x64
          path: dist/TractionWorkbench-*-windows-x64.zip
          if-no-files-found: error
      - name: Upload self-test screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-windows
          path: build/selftest
          if-no-files-found: ignore
      - name: Attach to a GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TractionWorkbench-*-windows-x64.zip \
            --title "Traction Workbench $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md \
          || gh release upload "$GITHUB_REF_NAME" dist/TractionWorkbench-*-windows-x64.zip --clobber
